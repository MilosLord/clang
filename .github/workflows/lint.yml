name: lint

# Sve provere zive u tests/run.sh (isti skript radi i lokalno):
#   installer (hook u pravi repo, --link bez pokvarenih linkova, placeholder),
#   hook (pozitivni + negativni slucajevi, fail-closed bez alata),
#   samples (format, tidy, RunOnce stvarno >30 linija, SampleTest build + run).
#
# Verzije alata su PINOVANE na ono sto je testirano lokalno. Wildcard grupe (bugprone-*)
# menjaju ponasanje izmedju LLVM izdanja — bump je namerna odluka, ne slucajnost.

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned clang-format / clang-tidy
        run: |
          python3 -m pip install --quiet 'clang-format==23.1.0' 'clang-tidy==22.1.8'
          clang-format --version
          clang-tidy --version | head -2

      - name: profiles parse
        run: |
          for p in std unreal; do
            (cd "$p" && clang-format --dump-config > /dev/null) || { echo "::error::$p/.clang-format ne parsira"; exit 1; }
          done

      - name: tests/run.sh
        run: ./tests/run.sh
